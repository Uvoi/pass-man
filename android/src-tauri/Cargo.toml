[package]
name = "pass-man-android"
version = "0.1.0"
description = "Android shell for PassMan"
authors = ["PassMan contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "pass_man_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
