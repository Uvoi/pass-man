[package]
name = "pass-man-desktop"
version = "0.1.0"
description = "Desktop shell for PassMan"
authors = ["PassMan contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "pass_man_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
